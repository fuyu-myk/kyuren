[package]
name = "kyuren"
version = "0.0.0"
license = "MIT"
description = "Kyuren personal assistant"
edition = "2021"
rust-version = "1.95"

[lib]
name = "kyuren_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "net"] }
tauri-plugin-global-shortcut = "2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
keyring = "4"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
percent-encoding = "2"
# Already in the build through the panel crate; named here for the screen and cursor the island reads.
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
# The reader's own answers to a page: already in the build through the webview, at these versions.
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "block2", "WKUIDelegate", "WKWebView", "WKFrameInfo", "WKSecurityOrigin", "WKContentRuleList", "WKContentRuleListStore", "WKUserContentController", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKPreferences"] }
block2 = "0.6.2"
# The island's system widgets: processor, memory, disk and network from sysinfo (MIT), and the GPU's
# own busy count from IOKit through the objc2 bindings sysinfo already brings (taken under MIT).
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "libc"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFDictionary", "CFNumber"] }
# The island's shelf: icons handed to the page as data, and files found again by their number on
# their disk through libc.
base64 = "0.22"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
